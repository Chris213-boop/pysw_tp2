<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="/pysw_tp2/assets/css/sprite.css" rel="stylesheet">
    <title>Contacto</title>
</head>
<body>
    <div id="header"></div>

    <div class="container my-5">
        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-airplane"></i> Contacto - ADN Travel
                    </h2>

                    <form id="formContacto">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" class="form-control" id="nombre">
                            </div>
                            <small class="text-danger d-none" id="errorNombre">Ingrese un nombre válido</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <small class="text-danger d-none" id="errorEmail">Email inválido</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mensaje</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-chat-dots"></i>
                                </span>
                                <textarea class="form-control" id="mensaje" rows="4"></textarea>
                            </div>
                            <small class="text-danger d-none" id="errorMensaje">El mensaje debe tener al menos 10
                                caracteres</small>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary" id="btnEnviar">
                                <i class="bi bi-send"></i> Enviar
                            </button>
                        </div>
                        

                        <div class="text-center mt-3 d-none" id="spinner">
                            <div class="spinner-border text-primary"></div>
                            <p><i class="bi bi-hourglass-split"></i> Enviando mensaje...</p>
                            </div>
                            
                            <div class="modal fade" id="modalConfirmacion" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header bg-success text-white">
                                            <h5 class="modal-title">Mensaje enviado</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            ¡Gracias por contactarte con ADN Travel! 🌍
                                        </div>
                                        <div class="modal-footer">
                                            <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            </form>
                </div>
            </div>

        </div>
    </div>

    <div id="footer"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/pysw_tp2/assets/js/contacto.js"></script>
    <script src="/pysw_tp2/assets/js/include.js"></script>
</body>
</html>
